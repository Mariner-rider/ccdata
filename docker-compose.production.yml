version: '3.9'
services:
  postgres:
    image: postgres:16
  redis:
    image: redis:7
  object-storage:
    image: minio/minio:latest
    command: server /data
  queue-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    environment:
      CRAWL_MAX_PAGES_PER_SOURCE: ${CRAWL_MAX_PAGES_PER_SOURCE:-40}
      CRAWL_RATE_LIMIT_SECONDS: ${CRAWL_RATE_LIMIT_SECONDS:-1.5}
      CRAWL_TIMEOUT_SECONDS: ${CRAWL_TIMEOUT_SECONDS:-30}
      CRAWL_MAX_RETRIES: ${CRAWL_MAX_RETRIES:-3}
  core-api:
    build:
      context: .
      dockerfile: docker/Dockerfile.core
  browser-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.browser-worker
    deploy:
      replicas: 2
  search:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.2
  metrics:
    image: prom/prometheus:latest
